# ============================================================
# 数据库配置模板
# 复制为 src/main/resources/database.properties 后填写真实值
# 不要将填写后的 database.properties 提交到 Git
# ============================================================

# 生产环境应配置可信数据库证书；VERIFY_IDENTITY 会同时校验证书和主机名。
db.url=jdbc:mysql://127.0.0.1:3306/student_system?sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
db.username=your_database_username
db.password=your_database_password
