<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>绑定邮箱账号 | 学生智能学业管理系统</title>
    <link rel="stylesheet" href="lib/element-plus/index.css"/>
    <link rel="stylesheet" href="static/css/site-footer.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { background: linear-gradient(135deg, var(--sidebar-bg) 0%, var(--sidebar-hover-bg) 58%, var(--primary-color) 100%); display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; min-height: 100vh; overflow: auto; }
        .bind-card { width: 460px; max-width: calc(100vw - 32px); padding: 36px 40px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
        h2 { margin: 0 0 8px; color: var(--text-primary); text-align: center; }
        .sub { margin: 0 0 26px; color: var(--text-secondary); font-size: 13px; line-height: 1.7; text-align: center; }
        .bind-btn { width: 100%; height: 42px; }
        .switch-tip { margin: 16px 0 0; color: var(--text-secondary); font-size: 13px; text-align: center; }
        .switch-tip a { color: var(--primary-color); text-decoration: none; }
        .switch-tip a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<main class="page-main">
    <div class="bind-card" id="bindApp"></div>
</main>
<script src="lib/vue3/vue.global.prod.js"></script>
<script src="lib/axios/axios.min.js"></script>
<script src="lib/element-plus/index.full.js"></script>
<script src="lib/icons-vue.js"></script>
<script>
    (() => {
        const {createApp, reactive, ref} = Vue;
        const {ElMessage} = ElementPlus;
        const BASE_PATH = '/student_system';

        const app = createApp({
            template: `
                <h2>绑定已有邮箱账号</h2>
                <p class="sub">该 Gitee 账号尚未绑定系统账号，请输入已有邮箱和密码完成绑定。绑定后将直接登录。</p>
                <el-form ref="formRef" :model="form" :rules="rules" size="large">
                    <el-form-item prop="email">
                        <el-input v-model="form.email" placeholder="邮箱" :prefix-icon="MessageIcon"/>
                    </el-form-item>
                    <el-form-item prop="password">
                        <el-input v-model="form.password" type="password" show-password placeholder="密码" :prefix-icon="LockIcon" @keyup.enter="bindAccount"/>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" class="bind-btn" :loading="loading" @click="bindAccount">绑定并登录</el-button>
                    </el-form-item>
                </el-form>
                <p class="switch-tip">还没有本地账号？<a href="register.html" @click.prevent="goRegister">去注册邮箱账号</a></p>
            `,
            setup() {
                const formRef = ref(null);
                const loading = ref(false);
                const query = new URLSearchParams(location.search);
                const form = reactive({email: query.get("email") || "", password: ""});
                const MessageIcon = ElementPlusIconsVue.Message;
                const LockIcon = ElementPlusIconsVue.Lock;
                const rules = {
                    email: [
                        {required: true, message: '请输入邮箱', trigger: 'blur'},
                        {type: 'email', message: '邮箱格式不正确', trigger: 'blur'}
                    ],
                    password: [{required: true, message: '请输入密码', trigger: 'blur'}]
                };

                const goRegister = () => {
                    const email = form.email.trim().toLowerCase();
                    location.href = BASE_PATH + "/register.html?oauth=gitee"
                        + (email ? "&email=" + encodeURIComponent(email) : "");
                };

                const bindAccount = () => {
                    formRef.value.validate(valid => {
                        if (!valid) return;
                        loading.value = true;
                        axios.post(BASE_PATH + '/api/account/oauth/gitee/bind', {
                            email: form.email.trim().toLowerCase(),
                            password: form.password
                        }).then(res => {
                            const result = res.data;
                            if (result?.code === 200) {
                                ElMessage.success('绑定成功，正在进入系统');
                                setTimeout(() => location.href = BASE_PATH + '/home.html', 600);
                            } else {
                                ElMessage.error(result?.msg || '绑定失败');
                            }
                        }).catch(() => ElMessage.error('网络异常，请稍后重试'))
                          .finally(() => loading.value = false);
                    });
                };

                return {formRef, loading, form, rules, MessageIcon, LockIcon, bindAccount, goRegister};
            }
        });
        app.use(ElementPlus);
        for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
        app.mount('#bindApp');
    })();
</script>
</body>
</html>
