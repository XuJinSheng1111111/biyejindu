<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>登录 | 学生智能学业管理系统</title>
    <link rel="icon" href="static/image/admin2.ico"/>
    <link rel="stylesheet" href="lib/element-plus/index.css"/>
    <link rel="stylesheet" href="static/css/site-footer.css"/>
<script>
    (() => {
        const savedTheme = localStorage.getItem('sams_theme') || 'light';
        const mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        const applyTheme = () => {
            const dark = savedTheme === 'dark' || (savedTheme === 'auto' && mql?.matches);
            if (dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        };
        applyTheme();
        if (mql) {
            mql.addEventListener ? mql.addEventListener('change', applyTheme) : mql.addListener(applyTheme);
        }
    })();
</script>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body.auth-page {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .login-layout {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(28px, 5vw, 64px);
        width: min(1080px, 100%);
    }

    .login-card {
        flex: 0 1 460px;
        min-width: 0;
    }

    .login-intro {
        flex: 1 1 520px;
        min-width: 0;
        color: var(--text-secondary);
    }

    .login-intro h1 {
        margin-bottom: 18px;
        color: var(--text-primary);
        font-size: 30px;
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: .5px;
    }

    .login-intro-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .login-intro-list li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.8;
    }

    .login-intro-list .intro-check {
        flex: 0 0 auto;
        color: var(--primary-color);
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .login-layout {
            flex-direction: column;
            align-items: stretch;
            gap: 24px;
        }

        .login-intro {
            flex: 0 0 auto;
        }

        .login-intro h1 {
            margin-bottom: 14px;
            font-size: 24px;
            text-align: center;
        }

        .login-intro-list li {
            font-size: 13px;
        }

        .login-card {
            flex-basis: auto;
            width: 100%;
        }
    }
    .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 12px 0 18px;
    }

    .actions a {
        color: var(--primary-color);
        font-size: 13px;
        text-decoration: none;
    }

    .actions a:hover { text-decoration: underline; }

    .login-btn {
        width: 100%;
        height: 42px;
        font-size: 16px;
    }

    .slider-tip {
        margin-bottom: 16px;
        color: var(--text-secondary);
        font-size: 14px;
        text-align: center;
    }

    .drag-captcha {
        position: relative;
        height: 52px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--hover-bg);
        overflow: hidden;
        user-select: none;
        touch-action: none;
        cursor: pointer;
        transition: border-color .2s, background .2s;
    }

    .drag-captcha.passed {
        border-color: var(--success-color);
        background: var(--success-color-light);
    }

    .drag-captcha.dragging { cursor: grabbing; }

    .drag-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: linear-gradient(90deg, var(--primary-color-light) 0%, var(--primary-color-light) 70%, var(--primary-color) 100%);
        opacity: .85;
        transition: width .12s linear;
    }

    .drag-captcha.passed .drag-fill { width: 100% !important; opacity: .6; }

    .drag-text {
        position: absolute;
        inset: 0 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        font-size: 14px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 1;
    }

    .drag-captcha.passed .drag-text { color: var(--success-color); font-weight: 600; }

    .drag-thumb {
        position: absolute;
        top: 3px;
        left: 0;
        z-index: 2;
        width: 48px;
        height: 44px;
        border-radius: 8px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: left .12s linear, transform .12s linear, background .2s;
    }

    .drag-captcha.dragging .drag-thumb { transition: none; }
    .drag-captcha.passed .drag-thumb { background: var(--success-color); border-color: var(--success-color); }

    .thumb-icon {
        color: var(--primary-color);
        font-size: 24px;
        font-weight: 600;
        line-height: 1;
    }

    .drag-captcha.passed .thumb-icon { color: var(--white); }

    .slider-status {
        margin-top: 12px;
        color: var(--text-secondary);
        font-size: 13px;
        text-align: center;
    }

    .slider-status.success { color: var(--success-color); }

    .other-login-wrap { margin-top: 20px; }

    .divider-line {
        display: flex;
        align-items: center;
        color: var(--text-secondary);
        font-size: 13px;
    }

    .divider-line::before,
    .divider-line::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-color);
    }

    .divider-line span { padding: 0 12px; }

    .third-icon-group {
        display: flex;
        justify-content: center;
        margin-top: 10px;
    }

    .gitee-login-btn {
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 4px 12px var(--primary-color-shadow);
        transition: transform .2s ease, box-shadow .2s ease;
    }

    .gitee-login-btn:hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 8px 18px var(--primary-color-shadow-hover);
    }

    .gitee-logo-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
</style>
</head>
<body class="auth-page">
<main class="page-main">
    <span class="auth-deco d1"></span>
    <span class="auth-deco d2"></span>
    <span class="auth-deco d3"></span>
    <div class="login-layout">
        <section class="login-intro">
            <h1>学生智能学业管理系统 SIAMS</h1>
            <ul class="login-intro-list">
                <li><span class="intro-check">✔</span><span>成绩 Excel 导入导出，自动统计加权绩点、学期变化图表</span></li>
                <li><span class="intro-check">✔</span><span>本地规则学业统计，自动生成学期成绩概览</span></li>
                <li><span class="intro-check">✔</span><span>个人竞赛台账，记录竞赛、自动计算综测加分</span></li>
                <li><span class="intro-check">✔</span><span>学习计划管理，支持自定义学期学业规划</span></li>
            </ul>
        </section>
        <section class="auth-card login-card">
            <h2>欢迎登录</h2>
            <p class="sub">请输入账号信息进入系统</p>
            <div id="loginApp"></div>
        </section>
    </div>
</main>
<footer class="site-footer">
    <div class="footer-copy">学生智能学业管理系统 SIAMS V1.0</div>
</footer>
<script src="lib/vue3/vue.global.prod.js"></script>
<script src="lib/axios/axios.min.js"></script>
<script src="lib/element-plus/index.full.js"></script>
<script src="lib/icons-vue.js"></script>
<script>
    (() => {
        const {createApp, reactive, ref, onUnmounted} = Vue;
        const {ElMessage} = ElementPlus;
        const icons = ElementPlusIconsVue;
        const BASE_PATH = '/student_system';

        const app = createApp({
            template: `
                <el-form ref="formRef" :model="form" :rules="rules" size="large">
                    <el-form-item prop="email">
                        <el-input v-model="form.email" placeholder="请输入邮箱" :prefix-icon="MessageIcon"/>
                    </el-form-item>
                    <el-form-item prop="password">
                        <el-input v-model="form.password" type="password" placeholder="请输入密码" show-password
                                  :prefix-icon="LockIcon" @keyup.enter="sliderVisible ? loginWithSlider() : doLogin()"/>
                    </el-form-item>
                    <div v-if="sliderVisible" class="inline-captcha">
                        <div class="slider-tip">按住滑块，拖动到最右侧完成安全验证</div>
                        <div ref="sliderTrack" class="drag-captcha"
                             :class="{passed: sliderPassed, dragging: sliderDragging}"
                             @pointerdown="onSliderPointerDown"
                             @pointermove="onSliderPointerMove"
                             @pointerup="onSliderPointerUp"
                             @pointercancel="onSliderPointerUp">
                            <div class="drag-fill" :style="{width: sliderValue + '%'}"></div>
                            <span class="drag-text">{{ sliderPassed ? '验证通过' : '按住滑块，向右拖动' }}</span>
                            <div class="drag-thumb" :style="{left: sliderValue + '%', transform: 'translateX(-' + sliderValue + '%)'}">
                                <span class="thumb-icon">{{ sliderPassed ? '✓' : '›' }}</span>
                            </div>
                        </div>
                        <div class="slider-status" :class="{success: sliderPassed}">
                            {{ sliderPassed ? '验证通过，可以继续登录' : '尚未完成验证' }}
                        </div>
                    </div>
                    <div class="actions">
                        <el-checkbox v-model="remember">记住邮箱</el-checkbox>
                        <a href="register.html">去注册 &rsaquo;</a>
                    </div>
                    <el-button type="primary" class="login-btn" :loading="loading"
                               :disabled="sliderVisible && !sliderPassed"
                               @click="sliderVisible ? loginWithSlider() : doLogin()">
                        {{ sliderVisible ? '验证并登录' : '登 录' }}
                    </el-button>

                    <div class="other-login-wrap">
                        <div class="divider-line"><span>其他方式登录</span></div>
                        <div class="third-icon-group">
                            <a class="gitee-login-btn" href="/student_system/api/account/oauth/gitee/authorize" title="Gitee一键登录" aria-label="Gitee一键登录">
                                <img class="gitee-logo-img" src="static/image/gitee.jpg" alt="Gitee">
                            </a>
                        </div>
                    </div>
                </el-form>


            `,
            setup() {
                const formRef = ref(null);
                const loading = ref(false);
                const remember = ref(false);
                const form = reactive({email: '', password: ''});
                const sliderVisible = ref(false);
                const sliderValue = ref(0);
                const sliderTarget = ref(100);
                const sliderToken = ref('');
                const sliderPassed = ref(false);
                const sliderPurpose = ref('login');
                const sliderTrack = ref(null);
                const sliderDragging = ref(false);
                let sliderPointerId = null;

                const MessageIcon = icons.Message;
                const LockIcon = icons.Lock;

                const savedEmail = localStorage.getItem('remember_email');
                if (savedEmail) {
                    form.email = savedEmail;
                    remember.value = true;
                }

                const rules = {
                    email: [
                        {required: true, message: '请输入邮箱', trigger: 'blur'},
                        {type: 'email', message: '邮箱格式不正确', trigger: 'blur'}
                    ],
                    password: [
                        {required: true, message: '请输入密码', trigger: 'blur'},
                        {min: 6, message: '密码长度不能少于6位', trigger: 'blur'}
                    ]
                };

                async function openSlider(purpose = 'login') {
                    sliderPurpose.value = purpose;
                    sliderValue.value = 0;
                    sliderPassed.value = false;
                    const response = await axios.get(BASE_PATH + '/api/account/sliderChallenge', {
                        params: {purpose}
                    });
                    const result = response.data;
                    if (result?.code !== 200) {
                        ElMessage.error(result?.msg || '滑块验证初始化失败');
                        return;
                    }
                    sliderToken.value = result.data.token;
                    sliderTarget.value = 100;
                    sliderVisible.value = true;
                }

                function updateSliderFromPointer(event) {
                    const track = sliderTrack.value;
                    if (!track) return;
                    const rect = track.getBoundingClientRect();
                    const thumb = track.querySelector('.drag-thumb');
                    const thumbWidth = thumb ? thumb.offsetWidth : 48;
                    const usableWidth = Math.max(rect.width - thumbWidth, 1);
                    const x = Math.min(Math.max(event.clientX - rect.left - thumbWidth / 2, 0), usableWidth);
                    const value = Math.round((x / usableWidth) * 100);
                    sliderValue.value = value;
                    if (value >= sliderTarget.value) {
                        sliderValue.value = 100;
                        sliderPassed.value = true;
                        sliderDragging.value = false;
                    }
                }

                function onSliderPointerDown(event) {
                    if (sliderPassed.value) return;
                    sliderDragging.value = true;
                    sliderPointerId = event.pointerId;
                    if (event.currentTarget.setPointerCapture) {
                        event.currentTarget.setPointerCapture(event.pointerId);
                    }
                    updateSliderFromPointer(event);
                }

                function onSliderPointerMove(event) {
                    if (!sliderDragging.value) return;
                    if (sliderPointerId !== null && event.pointerId !== sliderPointerId) return;
                    updateSliderFromPointer(event);
                }

                function onSliderPointerUp(event) {
                    if (!sliderDragging.value) return;
                    updateSliderFromPointer(event);
                    sliderDragging.value = false;
                    sliderPointerId = null;
                    if (!sliderPassed.value) {
                        sliderValue.value = 0;
                    }
                }

                const DEFAULT_DISPLAY_SETTINGS = {
                    theme: 'light',
                    themeColor: 'blue',
                    fontSize: 'normal',
                    sidebarCollapsed: false
                };
                const DISPLAY_COLORS = {
                    blue: ['#409EFF', '#66b1ff', '#ecf5ff', '#1f2d3d'],
                    green: ['#67C23A', '#85ce61', '#f0f9eb', '#1e3524'],
                    orange: ['#E6A23C', '#ebb563', '#fdf6ec', '#3a2f1f'],
                    red: ['#F56C6C', '#f78989', '#fef0f0', '#3a2024'],
                    purple: ['#9b59b6', '#b37bcb', '#f5eef8', '#2f2338']
                };

                function normalizeDisplaySettings(value) {
                    const raw = value && typeof value === 'object' ? value : {};
                    return {
                        theme: ['light', 'dark', 'auto'].includes(raw.theme) ? raw.theme : DEFAULT_DISPLAY_SETTINGS.theme,
                        themeColor: Object.keys(DISPLAY_COLORS).includes(raw.themeColor)
                            ? raw.themeColor : DEFAULT_DISPLAY_SETTINGS.themeColor,
                        fontSize: ['normal', 'large', 'xlarge'].includes(raw.fontSize)
                            ? raw.fontSize : DEFAULT_DISPLAY_SETTINGS.fontSize,
                        sidebarCollapsed: raw.sidebarCollapsed === true
                    };
                }

                function applyDisplaySettings(value) {
                    const settings = normalizeDisplaySettings(value);
                    localStorage.setItem('sys_setting', JSON.stringify(settings));
                    localStorage.setItem('sams_theme', settings.theme);

                    const root = document.documentElement;
                    root.removeAttribute('data-theme');
                    document.body.classList.remove('dark');
                    const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
                    const dark = settings.theme === 'dark' || (settings.theme === 'auto' && media?.matches);
                    if (dark) {
                        root.setAttribute('data-theme', 'dark');
                        document.body.classList.add('dark');
                    }

                    const color = DISPLAY_COLORS[settings.themeColor] || DISPLAY_COLORS.blue;
                    root.style.setProperty('--primary-color', color[0]);
                    root.style.setProperty('--el-color-primary', color[0]);
                    root.style.setProperty('--el-color-primary-light-3', color[1]);
                    root.style.setProperty('--primary-color-hover', color[1]);
                    root.style.setProperty('--primary-color-light', dark ? color[3] : color[2]);

                    const fontSize = {normal: '14px', large: '15px', xlarge: '17px'}[settings.fontSize] || '14px';
                    root.style.setProperty('--app-font-size', fontSize);
                    root.style.fontSize = fontSize;
                }

                async function syncDisplaySettings() {
                    try {
                        const res = await axios.get(BASE_PATH + '/api/settings/get', {timeout: 3000});
                        if (res.data?.code === 200 && res.data.data) {
                            applyDisplaySettings(res.data.data);
                            return;
                        }
                    } catch (e) {

                    }
                    try {
                        const local = JSON.parse(localStorage.getItem('sys_setting') || '{}');
                        applyDisplaySettings(local);
                    } catch (e) {
                        applyDisplaySettings(DEFAULT_DISPLAY_SETTINGS);
                    }
                }

                async function submitLogin(useSlider) {
                    loading.value = true;
                    try {
                        const savedSessionValue = localStorage.getItem('login_session_days');
                        const savedSessionDays = savedSessionValue === null ? 30 : Number(savedSessionValue);
                        const sessionDays = [7, 30].includes(savedSessionDays) ? savedSessionDays : 30;
                        const response = await axios.post(BASE_PATH + '/api/account/login', {
                            email: form.email.trim().toLowerCase(),
                            password: form.password,
                            sliderToken: useSlider ? sliderToken.value : null,
                            sliderValue: useSlider ? sliderValue.value : null,
                            sessionDays
                        });
                        const result = response.data;
                        if (result?.code === 200) {
                            if (remember.value) {
                                localStorage.setItem('remember_email', form.email.trim().toLowerCase());
                            } else {
                                localStorage.removeItem('remember_email');
                            }
                            await syncDisplaySettings();
                            ElMessage.success('登录成功，正在跳转...');
                            setTimeout(() => location.href = BASE_PATH + '/home.html', 500);
                            return true;
                        }

                        if (result?.code === 428) {
                            await openSlider('login');
                            ElMessage.warning(result.msg || '请完成滑块验证');
                            return false;
                        }

                        ElMessage.error(result?.msg || '邮箱或密码错误');
                        return false;
                    } catch (error) {
                        ElMessage.error(error.response?.data?.msg || '网络异常，请稍后重试');
                        return false;
                    } finally {
                        loading.value = false;
                    }
                }

                const doLogin = () => {
                    formRef.value.validate(valid => {
                        if (valid) submitLogin(false);
                    });
                };

                const loginWithSlider = async () => {
                    if (!sliderPassed.value) {
                        ElMessage.warning('请先完成滑块验证');
                        return;
                    }
                    const success = await submitLogin(true);
                    if (success) {
                        sliderVisible.value = false;
                        return;
                    }

                    try {
                        await openSlider('login');
                    } catch (error) {
                        ElMessage.error('滑块验证刷新失败，请重试');
                    }
                };

                onUnmounted(() => {});

                return {
                    form, rules, formRef, loading, remember,
                    sliderVisible, sliderValue, sliderTarget, sliderPassed,
                    sliderTrack, sliderDragging, onSliderPointerDown,
                    onSliderPointerMove, onSliderPointerUp,
                    MessageIcon, LockIcon,
                    doLogin, loginWithSlider
                };
            }
        });
        app.use(ElementPlus);
        for (const [k, c] of Object.entries(icons)) app.component(k, c);
        app.mount('#loginApp');
    })();
</script>
</body>
</html>
