<style>
    .page-wrap {
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .plan-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 20px;
        padding: 20px 24px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--card-bg);
    }

    .plan-header .h-left h2 {
        margin: 0 0 4px;
        color: var(--text-primary);
        font-size: 18px;
        font-weight: 600;
    }

    .plan-header .h-left .date {
        color: var(--text-secondary);
        font-size: 13px;
    }

    .plan-header .h-right {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .progress-wrap {
        width: 220px;
    }

    .progress-wrap .p-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
        color: var(--text-secondary);
        font-size: 12px;
    }

    .kanban {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: start;
        gap: 16px;
    }

    .kanban-col {
        overflow: hidden;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--card-bg);
    }

    .kanban-col .col-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
    }

    .kanban-col .col-title {
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 600;
    }

    .col-count {
        padding: 1px 7px;
        border: 1px solid var(--border-color);
        border-radius: 3px;
        color: var(--text-secondary);
        font-size: 12px;
    }

    .task-list {
        padding: 0 16px;
    }

    .task-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--border-color-light);
        transition: background-color .15s ease;
    }

    .task-item:last-child {
        border-bottom: none;
    }

    .task-item:hover {
        background: var(--hover-bg);
    }

    .task-item.done .t-title {
        color: var(--text-secondary);
        text-decoration: line-through;
    }

    .task-check {
        margin-top: 2px;
        flex-shrink: 0;
    }

    .task-main {
        flex: 1;
        min-width: 0;
    }

    .task-main .t-title {
        color: var(--text-primary);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.45;
        word-break: break-all;
    }

    .task-main .t-content {
        margin-top: 4px;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.6;
        word-break: break-all;
    }

    .task-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
        color: var(--text-secondary);
        font-size: 12px;
    }

    .meta-item {
        color: var(--text-secondary);
    }

    .tag-outline {
        display: inline-flex;
        align-items: center;
        padding: 1px 7px;
        border: 1px solid var(--border-color);
        border-radius: 3px;
        background: transparent;
        color: var(--text-secondary);
        font-size: 11px;
        line-height: 18px;
    }

    .tag-outline.priority-high {
        border-color: var(--danger-color);
        color: var(--danger-color);
    }

    .tag-outline.priority-mid {
        border-color: var(--warning-color);
        color: var(--warning-color);
    }

    .tag-outline.priority-low {
        border-color: var(--success-color);
        color: var(--success-color);
    }

    .task-actions {
        display: flex;
        align-items: flex-start;
        gap: 4px;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity .15s ease;
    }

    .task-item:hover .task-actions {
        opacity: 1;
    }

    .task-empty {
        padding: 32px 0;
        text-align: center;
        color: var(--text-secondary);
        font-size: 13px;
    }

    @media (max-width: 1000px) {
        .kanban {
            grid-template-columns: 1fr;
        }

        .task-actions {
            opacity: 1;
        }
    }
</style>

<div class="page-wrap">
    <div id="planApp"></div>
</div>

<script>
    (() => {
        const { createApp, reactive, ref, computed, onMounted } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;
        const CTX = '/student_system';

        const API_PLAN_LIST = CTX + '/api/plan/list';
        const API_PLAN_CREATE = CTX + '/api/plan/create';
        const API_PLAN_UPDATE = CTX + '/api/plan/update';
        const API_PLAN_TOGGLE = CTX + '/api/plan/toggle';
        const API_PLAN_DELETE = CTX + '/api/plan/delete';

        createApp({
            template: `
                <div>
                    <div class="plan-header">
                        <div class="h-left">
                            <h2>学习计划管理</h2>
                            <div class="date">{{ todayStr }} · 共 {{ total }} 个任务，已完成 {{ doneCount }} 个</div>
                        </div>
                        <div class="h-right">
                            <div class="progress-wrap" v-if="todayTasks.length">
                                <div class="p-label">
                                    <span>今日待办进度</span>
                                    <span>{{ todayPercent }}%</span>
                                </div>
                                <el-progress :percentage="todayPercent" :stroke-width="8" :color="progressColor" :show-text="false"/>
                            </div>
                            <el-button type="primary" @click="openDialog()">新增任务</el-button>
                        </div>
                    </div>

                    <div class="kanban">
                        <section class="kanban-col" v-for="col in columns" :key="col.key">
                            <div class="col-head">
                                <span class="col-title">{{ col.title }}</span>
                                <span class="col-count">{{ colTasks(col.key).length }}</span>
                            </div>
                            <div class="task-list">
                                <div v-if="!colTasks(col.key).length" class="task-empty">暂无任务</div>
                                <article v-for="t in colTasks(col.key)" :key="t.id"
                                         class="task-item" :class="{done:t.done}">
                                    <el-checkbox class="task-check" :model-value="!!t.done"
                                                 @change="toggleDone(t)"></el-checkbox>
                                    <div class="task-main">
                                        <div class="t-title">{{ t.title }}</div>
                                        <div class="t-content" v-if="t.content">{{ t.content }}</div>
                                        <div class="task-meta">
                                            <span v-if="isCompetition(t)" class="tag-outline">竞赛任务</span>
                                            <span class="tag-outline" :class="'priority-' + t.priority">
                                                {{ prioLabel(t.priority) }}
                                            </span>
                                            <span v-if="t.deadline" class="meta-item">截止：{{ deadlineText(t) }}</span>
                                        </div>
                                    </div>
                                    <div class="task-actions">
                                        <el-button v-if="!isCompetition(t)" link size="small"
                                                   @click="openDialog(t)">编辑</el-button>
                                        <el-button link type="danger" size="small"
                                                   @click="removeTask(t)">删除</el-button>
                                    </div>
                                </article>
                            </div>
                        </section>
                    </div>

                    <el-dialog v-model="dialogVisible" :title="editing ? '编辑任务' : '新增任务'" width="480px">
                        <el-form :model="form" label-width="80px" :rules="rules" ref="formRef">
                            <el-form-item label="标题" prop="title">
                                <el-input v-model="form.title" placeholder="任务标题" maxlength="40" show-word-limit/>
                            </el-form-item>
                            <el-form-item label="内容">
                                <el-input v-model="form.content" type="textarea" :rows="3"
                                          placeholder="任务描述或备注（可选）" maxlength="200"/>
                            </el-form-item>
                            <el-form-item label="分类" prop="category">
                                <el-radio-group v-model="form.category">
                                    <el-radio value="today">今日待办</el-radio>
                                    <el-radio value="week">本周计划</el-radio>
                                    <el-radio value="month">月度目标</el-radio>
                                </el-radio-group>
                            </el-form-item>
                            <el-form-item label="优先级" prop="priority">
                                <el-radio-group v-model="form.priority">
                                    <el-radio value="high">高</el-radio>
                                    <el-radio value="mid">中</el-radio>
                                    <el-radio value="low">低</el-radio>
                                </el-radio-group>
                            </el-form-item>
                            <el-form-item label="截止日期">
                                <el-date-picker v-model="form.deadline" type="date" placeholder="选择日期"
                                                value-format="YYYY-MM-DD" style="width:100%"/>
                            </el-form-item>
                        </el-form>
                        <template #footer>
                            <el-button @click="dialogVisible=false">取消</el-button>
                            <el-button type="primary" @click="saveTask">{{ editing ? '保存修改' : '添加任务' }}</el-button>
                        </template>
                    </el-dialog>
                </div>
            `,
            setup() {
                const columns = [
                    {key: 'today', title: '今日待办'},
                    {key: 'week', title: '本周计划'},
                    {key: 'month', title: '月度目标'}
                ];

                const tasks = ref([]);
                const dialogVisible = ref(false);
                const editing = ref(null);
                const formRef = ref(null);
                const form = reactive({title: '', content: '', category: 'today', priority: 'mid', deadline: ''});
                const rules = {
                    title: [{required: true, message: '请输入标题', trigger: 'blur'}],
                    category: [{required: true, message: '请选择分类', trigger: 'change'}],
                    priority: [{required: true, message: '请选择优先级', trigger: 'change'}]
                };

                const loadTasks = async () => {
                    try {
                        const response = await axios.post(API_PLAN_LIST, {});
                        const result = response.data;
                        if (result?.code === 401) {
                            ElMessage.error('登录状态已失效，请重新登录');
                            setTimeout(() => location.href = CTX + '/login.html', 800);
                            return;
                        }
                        if (result?.code !== 200) {
                            throw new Error(result?.msg || '加载学习计划失败');
                        }
                        tasks.value = Array.isArray(result.data) ? result.data : [];
                    } catch (error) {
                        tasks.value = [];
                        ElMessage.error(error.response?.data?.msg || error.message || '加载学习计划失败');
                    }
                };

                const todayStr = computed(() => {
                    const d = new Date();
                    const w = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
                    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + w;
                });
                const total = computed(() => tasks.value.length);
                const doneCount = computed(() => tasks.value.filter(t => t.done).length);
                const todayTasks = computed(() => tasks.value.filter(t => t.category === 'today'));
                const todayPercent = computed(() => {
                    const all = todayTasks.value.length;
                    if (!all) return 0;
                    return Math.round(todayTasks.value.filter(t => t.done).length / all * 100);
                });
                const progressColor = computed(() => themeCssVar('--primary-color'));
                const colTasks = (key) => tasks.value.filter(t => t.category === key);
                const prioLabel = (priority) => ({high: '高优先级', mid: '中优先级', low: '低优先级'}[priority] || '中优先级');
                const isCompetition = (task) => task?.sourceType === 'competition';

                const deadlineText = (task) => {
                    if (!task?.deadline) return '';
                    const today = new Date();
                    const target = new Date(task.deadline + 'T00:00:00');
                    const days = Math.ceil((target - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
                    if (Number.isNaN(days)) return task.deadline;
                    if (days < 0) return '已截止';
                    if (days === 0) return '今天截止';
                    if (days === 1) return '明天截止';
                    return days + '天后截止';
                };

                const openDialog = (task) => {
                    if (isCompetition(task)) {
                        ElMessage.info('竞赛任务由竞赛信息自动生成，请在竞赛页面管理');
                        return;
                    }
                    if (task) {
                        editing.value = task;
                        Object.assign(form, {
                            title: task.title,
                            content: task.content,
                            category: task.category,
                            priority: task.priority,
                            deadline: task.deadline || ''
                        });
                    } else {
                        editing.value = null;
                        Object.assign(form, {title: '', content: '', category: 'today', priority: 'mid', deadline: ''});
                    }
                    dialogVisible.value = true;
                };

                const saveTask = () => {
                    formRef.value.validate(async valid => {
                        if (!valid) return;
                        const payload = {
                            title: form.title,
                            content: form.content,
                            category: form.category,
                            priority: form.priority,
                            deadline: form.deadline || null
                        };
                        try {
                            if (editing.value) {
                                payload.id = editing.value.id;
                                const response = await axios.post(API_PLAN_UPDATE, payload);
                                if (response.data?.code !== 200) throw new Error(response.data?.msg || '更新失败');
                                ElMessage.success('已更新');
                            } else {
                                const response = await axios.post(API_PLAN_CREATE, payload);
                                if (response.data?.code !== 200) throw new Error(response.data?.msg || '添加失败');
                                ElMessage.success('已添加');
                            }
                            dialogVisible.value = false;
                            await loadTasks();
                        } catch (error) {
                            ElMessage.error(error.response?.data?.msg || error.message || '保存失败');
                        }
                    });
                };

                const toggleDone = async (task) => {
                    const nextDone = !task.done;
                    try {
                        const response = await axios.post(API_PLAN_TOGGLE, {id: task.id, done: nextDone});
                        if (response.data?.code !== 200) throw new Error(response.data?.msg || '状态更新失败');
                        task.done = nextDone;
                    } catch (error) {
                        ElMessage.error(error.response?.data?.msg || error.message || '状态更新失败');
                    }
                };

                const removeTask = (task) => {
                    ElMessageBox.confirm('确定删除该任务？', '提示', {type: 'warning'}).then(async () => {
                        try {
                            const response = await axios.post(API_PLAN_DELETE, {id: task.id});
                            if (response.data?.code !== 200) throw new Error(response.data?.msg || '删除失败');
                            await loadTasks();
                            ElMessage.success('已删除');
                        } catch (error) {
                            ElMessage.error(error.response?.data?.msg || error.message || '删除失败');
                        }
                    }).catch(() => {});
                };

                onMounted(() => {
                    loadTasks();
                });

                return {
                    columns,
                    tasks,
                    dialogVisible,
                    editing,
                    formRef,
                    form,
                    rules,
                    todayStr,
                    total,
                    doneCount,
                    todayTasks,
                    todayPercent,
                    progressColor,
                    colTasks,
                    prioLabel,
                    openDialog,
                    saveTask,
                    toggleDone,
                    removeTask,
                    isCompetition,
                    deadlineText
                };
            }
        }).use(ElementPlus).mount('#planApp');
    })();
</script>
