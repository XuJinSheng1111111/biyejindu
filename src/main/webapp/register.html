<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>注册 | 学生智能学业管理系统</title>
    <link rel="icon" href="static/image/admin2.ico"/>
    <link rel="stylesheet" href="lib/element-plus/index.css"/>
    <link rel="stylesheet" href="static/css/site-footer.css"/>
<script>
    (() => {
        const savedTheme = localStorage.getItem('sams_theme') || 'light';
        const mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        const applyTheme = () => {
            const dark = savedTheme === 'dark' || (savedTheme === 'auto' && mql?.matches);
            if (dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        };
        applyTheme();
        if (mql) {
            mql.addEventListener ? mql.addEventListener('change', applyTheme) : mql.addListener(applyTheme);
        }
    })();
</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body.auth-page {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }


        .back-link { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary); }
        .back-link a { color: var(--primary-color); text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
        .reg-btn { width: 100%; height: 42px; font-size: 16px; }
        .code-row { display: flex; gap: 10px; align-items: center; width: 100%; }
        .code-row .el-input { flex: 1; }
        .code-img-box {
            width: 120px; height: 40px; border-radius: 6px; cursor: pointer;
            border: 1px solid var(--border-color); flex-shrink: 0; object-fit: cover;
        }
        .code-img-box:hover { opacity: 0.85; }

        .slider-tip {
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
        }

        .drag-captcha {
            position: relative;
            height: 52px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--hover-bg);
            overflow: hidden;
            user-select: none;
            touch-action: none;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }

        .drag-captcha.passed {
            border-color: var(--success-color);
            background: var(--success-color-light);
        }

        .drag-captcha.dragging {
            cursor: grabbing;
        }

        .drag-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            background: linear-gradient(90deg, var(--primary-color-light) 0%, var(--primary-color-light) 70%, var(--primary-color) 100%);
            opacity: .85;
            transition: width .12s linear;
        }

        .drag-captcha.passed .drag-fill {
            width: 100% !important;
            opacity: .6;
        }

        .drag-text {
            position: absolute;
            inset: 0 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
        }

        .drag-captcha.passed .drag-text {
            color: var(--success-color);
            font-weight: 600;
        }

        .drag-thumb {
            position: absolute;
            top: 3px;
            left: 0;
            z-index: 2;
            width: 48px;
            height: 44px;
            border-radius: 9px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left .12s linear, transform .12s linear, background .2s;
        }

        .drag-captcha.dragging .drag-thumb {
            transition: none;
        }

        .drag-captcha.passed .drag-thumb {
            background: var(--success-color);
            border-color: var(--success-color);
        }

        .thumb-icon {
            font-size: 24px;
            line-height: 1;
            color: var(--primary-color);
            font-weight: 600;
        }

        .drag-captcha.passed .thumb-icon {
            color: var(--white);
        }

        .slider-status {
            margin-top: 12px;
            color: var(--text-secondary);
            font-size: 13px;
            text-align: center;
        }

        .slider-status.success {
            color: var(--success-color);
        }
    </style>
</head>
<body class="auth-page">
<main class="page-main">
    <span class="auth-deco d1"></span>
    <span class="auth-deco d2"></span>
    <span class="auth-deco d3"></span>
    <section class="auth-card reg-box">
        <h2>创建账号</h2>
        <p class="sub">注册学生智能学业管理系统新账号</p>
        <div id="regApp"></div>
        <p class="back-link">已有账号？<a href="login.html">去登录</a></p>
    </section>
</main>
<footer class="site-footer">
    <div class="footer-copy">学生智能学业管理系统 SIAMS V1.0</div>
</footer>
<script src="lib/vue3/vue.global.prod.js"></script>
<script src="lib/axios/axios.min.js"></script>
<script src="lib/element-plus/index.full.js"></script>
<script src="lib/icons-vue.js"></script>
<script>
    (() => {
        const {createApp, reactive, ref, onUnmounted} = Vue;
        const {ElMessage} = ElementPlus;
        const icons = ElementPlusIconsVue;
        const BASE_PATH = '/student_system';

        const cleanPassword = (val) => {
            if (!val) return '';
            return String(val).replace(/[\s\u3000]/g, '').replace(/[\u200B-\u200D\uFEFF]/g, '');
        };

        const app = createApp({
            template: `
                <el-form ref="formRef" :model="form" :rules="rules" size="large" label-width="105px">
                    <el-form-item label="邮箱" prop="email">
                        <el-input v-model="form.email" placeholder="请输入邮箱" :prefix-icon="MessageIcon"/>
                    </el-form-item>

                    <el-form-item label="邮箱验证码" prop="code">
                        <div class="code-row">
                            <el-input v-model="form.code" placeholder="请输入验证码" maxlength="6" :prefix-icon="KeyIcon" style="flex:1;"/>
                            <el-button type="primary" plain :disabled="countdown > 0 || codeLoading"
                                       :loading="codeLoading" @click="openRegisterSlider">
                                {{ countdown > 0 ? countdown + '秒后重试' : '获取验证码' }}
                            </el-button>
                        </div>
                    </el-form-item>

                    <el-form-item label="登录密码" prop="password">
                        <el-input v-model="form.password" type="password" placeholder="密码（6-16位，勿含空格）" show-password
                                  autocomplete="new-password" :prefix-icon="LockIcon"/>
                    </el-form-item>
                    <el-form-item label="确认密码" prop="checkPass">
                        <el-input v-model="form.checkPass" type="password" placeholder="再次输入新密码" show-password
                                  autocomplete="new-password" :prefix-icon="LockIcon"/>
                    </el-form-item>
                    <div v-if="sliderVisible" class="inline-captcha">
                        <div class="slider-tip">按住滑块，拖动到最右侧完成安全验证</div>
                        <div ref="sliderTrack" class="drag-captcha"
                             :class="{passed: sliderPassed, dragging: sliderDragging}"
                             @pointerdown="onSliderPointerDown"
                             @pointermove="onSliderPointerMove"
                             @pointerup="onSliderPointerUp"
                             @pointercancel="onSliderPointerUp">
                            <div class="drag-fill" :style="{width: sliderValue + '%'}"></div>
                            <span class="drag-text">{{ sliderPassed ? '验证通过' : '按住滑块，向右拖动' }}</span>
                            <div class="drag-thumb" :style="{left: sliderValue + '%', transform: 'translateX(-' + sliderValue + '%)'}">
                                <span class="thumb-icon">{{ sliderPassed ? '✓' : '›' }}</span>
                            </div>
                        </div>
                        <div class="slider-status" :class="{success: sliderPassed}">
                            {{ sliderPassed ? '验证通过，可以发送验证码' : '尚未完成验证' }}
                        </div>
                        <el-button type="primary" class="captcha-submit" :disabled="!sliderPassed"
                                   :loading="codeLoading" @click="sendCodeWithSlider">验证并发送</el-button>
                    </div>
                    <el-form-item label-width="0">
                        <el-button type="primary" class="reg-btn" :loading="loading" @click="doReg">注 册</el-button>
                    </el-form-item>
                </el-form>


            `,
            setup() {
                const formRef = ref(null);
                const loading = ref(false);
                const codeLoading = ref(false);
                const countdown = ref(0);
                const query = new URLSearchParams(location.search);
                const oauthGitee = query.get("oauth") === "gitee";
                const presetEmail = query.get("email") || "";
                const form = reactive({email: presetEmail, code: "", password: "", checkPass: ""});
                const sliderVisible = ref(false);
                const sliderValue = ref(0);
                const sliderTarget = ref(100);
                const sliderToken = ref('');
                const sliderPassed = ref(false);
                const sliderTrack = ref(null);
                const sliderDragging = ref(false);
                let sliderPointerId = null;
                let countdownTimer = null;

                const MessageIcon = icons.Message;
                const LockIcon = icons.Lock;
                const KeyIcon = icons.Key;

                const validatePassword = (rule, value, callback) => {
                    const cleaned = cleanPassword(value);
                    if (!cleaned) return callback(new Error('请输入密码'));
                    if (cleaned.length < 6 || cleaned.length > 16) {
                        return callback(new Error('密码长度须为6-16位'));
                    }
                    callback();
                };

                const validateCheckPass = (rule, value, callback) => {
                    if (!value) return callback(new Error('请再次输入密码'));
                    if (cleanPassword(value) !== cleanPassword(form.password)) {
                        return callback(new Error('两次输入密码不一致'));
                    }
                    callback();
                };

                const rules = {
                    email: [
                        {required: true, message: '请输入邮箱', trigger: 'blur'},
                        {type: 'email', message: '邮箱格式不正确', trigger: 'blur'}
                    ],
                    code: [
                        {required: true, message: '请输入邮箱验证码', trigger: 'blur'},
                        {len: 6, message: '验证码为6位', trigger: 'blur'}
                    ],
                    password: [{required: true, validator: validatePassword, trigger: 'blur'}],
                    checkPass: [{required: true, validator: validateCheckPass, trigger: ['blur', 'change']}]
                };

                async function openRegisterSlider() {
                    if (countdown.value > 0 || codeLoading.value) return;
                    if (formRef.value) {
                        try {
                            await formRef.value.validateField('email');
                        } catch (error) {
                            return;
                        }
                    }
                    try {
                        const response = await axios.get(BASE_PATH + '/api/account/sliderChallenge', {
                            params: {purpose: 'register'}
                        });
                        const result = response.data;
                        if (result?.code !== 200) {
                            ElMessage.error(result?.msg || '滑块验证初始化失败');
                            return;
                        }
                        sliderToken.value = result.data.token;
                        sliderTarget.value = 100;
                        sliderValue.value = 0;
                        sliderPassed.value = false;
                        sliderVisible.value = true;
                    } catch (error) {
                        ElMessage.error('滑块验证初始化失败');
                    }
                }

                function updateSliderFromPointer(event) {
                    const track = sliderTrack.value;
                    if (!track) return;
                    const rect = track.getBoundingClientRect();
                    const thumb = track.querySelector('.drag-thumb');
                    const thumbWidth = thumb ? thumb.offsetWidth : 48;
                    const usableWidth = Math.max(rect.width - thumbWidth, 1);
                    const x = Math.min(Math.max(event.clientX - rect.left - thumbWidth / 2, 0), usableWidth);
                    const value = Math.round((x / usableWidth) * 100);
                    sliderValue.value = value;
                    if (value >= sliderTarget.value) {
                        sliderValue.value = 100;
                        sliderPassed.value = true;
                        sliderDragging.value = false;
                    }
                }

                function onSliderPointerDown(event) {
                    if (sliderPassed.value) return;
                    sliderDragging.value = true;
                    sliderPointerId = event.pointerId;
                    if (event.currentTarget.setPointerCapture) {
                        event.currentTarget.setPointerCapture(event.pointerId);
                    }
                    updateSliderFromPointer(event);
                }

                function onSliderPointerMove(event) {
                    if (!sliderDragging.value) return;
                    if (sliderPointerId !== null && event.pointerId !== sliderPointerId) return;
                    updateSliderFromPointer(event);
                }

                function onSliderPointerUp(event) {
                    if (!sliderDragging.value) return;
                    updateSliderFromPointer(event);
                    sliderDragging.value = false;
                    sliderPointerId = null;
                    if (!sliderPassed.value) {
                        sliderValue.value = 0;
                    }
                }

                function startCountdown() {
                    countdown.value = 60;
                    clearInterval(countdownTimer);
                    countdownTimer = setInterval(() => {
                        countdown.value -= 1;
                        if (countdown.value <= 0) {
                            clearInterval(countdownTimer);
                            countdown.value = 0;
                        }
                    }, 1000);
                }

                async function sendCodeWithSlider() {
                    if (!sliderPassed.value) {
                        ElMessage.warning('请先完成滑块验证');
                        return;
                    }
                    codeLoading.value = true;
                    try {
                        const response = await axios.post(BASE_PATH + '/api/account/sendEmailCode', {
                            email: form.email.trim().toLowerCase(),
                            purpose: 'register',
                            sliderToken: sliderToken.value,
                            sliderValue: sliderValue.value
                        });
                        const result = response.data;
                        if (result?.code === 200) {
                            sliderVisible.value = false;
                            ElMessage.success('验证码已发送，请检查邮箱');
                            startCountdown();
                        } else {
                            ElMessage.error(result?.msg || '验证码发送失败');
                        }
                    } catch (error) {
                        ElMessage.error(error.response?.data?.msg || '验证码发送失败');
                    } finally {
                        codeLoading.value = false;
                    }
                }

                const doReg = () => {
                    formRef.value.validate(valid => {
                        if (!valid) return;
                        loading.value = true;
                        axios.post(BASE_PATH + '/api/account/register', {
                            email: form.email.trim().toLowerCase(),
                            password: cleanPassword(form.password),
                            confirmPassword: cleanPassword(form.checkPass),
                            code: form.code.trim()
                        }).then(response => {
                            const result = response.data;
                            if (result?.code === 200) {
                                ElMessage.success(oauthGitee ? '注册成功，即将返回 Gitee 绑定页' : '注册成功，即将跳转登录页');
                                const emailForBind = form.email.trim().toLowerCase();
                                const target = oauthGitee
                                    ? BASE_PATH + "/oauthBind.html?email=" + encodeURIComponent(emailForBind)
                                    : BASE_PATH + '/login.html';
                                setTimeout(() => location.href = target, 700);
                            } else {
                                ElMessage.error(result?.msg || '注册失败，请重试');
                            }
                        }).catch(error => {
                            ElMessage.error(error.response?.data?.msg || '网络异常，请稍后重试');
                        }).finally(() => {
                            loading.value = false;
                        });
                    });
                };

                onUnmounted(() => clearInterval(countdownTimer));

                return {
                    form, rules, formRef, loading, codeLoading, countdown,
                    sliderVisible, sliderValue, sliderTarget, sliderPassed,
                    sliderTrack, sliderDragging, onSliderPointerDown,
                    onSliderPointerMove, onSliderPointerUp,
                    MessageIcon, LockIcon, KeyIcon,
                    openRegisterSlider, sendCodeWithSlider, doReg
                };
            }
        });
        app.use(ElementPlus);
        for (const [k, c] of Object.entries(icons)) app.component(k, c);
        app.mount('#regApp');
    })();
</script>
</body>
</html>
